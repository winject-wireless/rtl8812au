PACKAGE_NAME="winject-rtl88xxau"
PACKAGE_VERSION="5.2.20.2~winject1"
CLEAN="'make' clean"
BUILT_MODULE_NAME[0]=88XXau_winject
PROCS_NUM=`nproc`
[ $PROCS_NUM -gt 16 ] && PROCS_NUM=16
DEST_MODULE_LOCATION[0]="/updates"
MAKE="'make' -j$PROCS_NUM KVER=${kernelver} KSRC=/lib/modules/${kernelver}/build"
AUTOINSTALL="yes"
REMAKE_INITRD=no
